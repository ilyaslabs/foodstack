name: Images

# Builds the server and the two apps, and pushes the images to Docker Hub
# (ilyasdotdev/ilyaslabs-foodstack) and GHCR (ghcr.io/ilyaslabs/foodstack), one repository each with
# the part in the tag: server-1.0.0, web-1.0.0, backoffice-1.0.0 (and -1.0, -latest).
# Called by release.yml (the version tags) and snapshot.yml (server-<branch>-snapshot on every push
# to a branch).
on:
  workflow_call:
    inputs:
      version:
        description: Maven version to build, e.g. 1.2.0 or 1.3.0-SNAPSHOT
        required: true
        type: string
      tags:
        description: Image tags, space separated
        required: true
        type: string
    secrets:
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_TOKEN:
        required: true

permissions:
  contents: write
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build the server
        run: mvn -B -DskipTests -Drevision=${{ inputs.version }} -pl app/foodstack-server -am package
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Build the web app and the back office
        working-directory: frontend
        run: pnpm install --frozen-lockfile && pnpm build
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push images (amd64 and arm64)
        env:
          TAGS: ${{ inputs.tags }}
        run: |
          push() {
            local name=$1; shift
            local args=()
            for tag in $TAGS; do
              args+=(-t "ilyasdotdev/ilyaslabs-foodstack:$name-$tag" -t "ghcr.io/ilyaslabs/foodstack:$name-$tag")
            done
            docker buildx build --platform linux/amd64,linux/arm64 --push "${args[@]}" "$@"
          }
          push server app/foodstack-server
          push web -f frontend/docker/web.Dockerfile frontend
          push backoffice -f frontend/docker/backoffice.Dockerfile frontend
