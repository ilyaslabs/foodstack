name: Images

# Builds the unit deployer zip and the images, and pushes the images to Docker Hub and GHCR.
# Called by snapshot-release.yml (tag "edge") and release.yml (the version tags).
on:
  workflow_call:
    inputs:
      version:
        description: Maven version to build, e.g. 1.2.0 or 1.3.0-SNAPSHOT
        required: true
        type: string
      tags:
        description: Image tags, space separated
        required: true
        type: string
      attach-to-release:
        description: Upload unit-deployer-<version>.zip to this GitHub release tag
        required: false
        type: string
        default: ''
    secrets:
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_TOKEN:
        required: true

permissions:
  contents: write
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build the server and the unit deployer zip
        run: mvn -B -DskipTests -Drevision=${{ inputs.version }} -pl deploy/unit-deployer -am package
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push images (amd64 and arm64)
        env:
          TAGS: ${{ inputs.tags }}
        run: |
          push() {
            local name=$1; shift
            local args=()
            for tag in $TAGS; do
              args+=(-t "ilyaslabs/$name:$tag" -t "ghcr.io/ilyaslabs/$name:$tag")
            done
            docker buildx build --platform linux/amd64,linux/arm64 --push "${args[@]}" "$@"
          }
          push foodstack-server app/foodstack-server
          push foodstack-web -f frontend/docker/web.Dockerfile frontend
          push foodstack-backoffice -f frontend/docker/backoffice.Dockerfile frontend
      - name: Attach the unit deployer to the release
        if: inputs.attach-to-release != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ inputs.attach-to-release }}" deploy/unit-deployer/target/unit-deployer-${{ inputs.version }}.zip --clobber
      - uses: actions/upload-artifact@v4
        with:
          name: unit-deployer-${{ inputs.version }}
          path: deploy/unit-deployer/target/unit-deployer-${{ inputs.version }}.zip
