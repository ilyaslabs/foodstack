name: Release

# A GitHub release named vX.Y.Z publishes the libraries to Maven Central, the images to Docker Hub
# and GHCR, and attaches foodstack-compose-X.Y.Z.zip (deploy/compose with the version filled in) to the
# release (TDD 15.2).
on:
  release:
    types: [published]

permissions:
  contents: write
  packages: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      minor: ${{ steps.version.outputs.minor }}
    steps:
      - id: version
        run: |
          version=${GITHUB_REF_NAME#v}
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "minor=${version%.*}" >> "$GITHUB_OUTPUT"

  maven:
    uses: ilyaslabs/cicd/.github/workflows/mvn-release.yml@main
    with:
      java-version: '25'
    secrets: inherit

  images:
    needs: [version, maven]
    uses: ./.github/workflows/images.yml
    with:
      version: ${{ needs.version.outputs.version }}
      tags: ${{ needs.version.outputs.version }} ${{ needs.version.outputs.minor }} latest
    secrets: inherit

  # Both Helm charts, versioned with the release, at oci://ghcr.io/ilyaslabs/charts (TDD 18.1):
  #   helm install foodstack oci://ghcr.io/ilyaslabs/charts/foodstack --version X.Y.Z
  charts:
    needs: [version, images]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: azure/setup-helm@v4
        with:
          version: v3.19.0
      - name: Package and push
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          for chart in foodstack foodstack-observability; do
            helm package "k8s/helm/$chart" --version "$VERSION" --app-version "$VERSION" -d dist
            helm push "dist/$chart-$VERSION.tgz" oci://ghcr.io/ilyaslabs/charts
          done

  # The Docker Compose files, with this version in .env.example, on the release page.
  compose:
    needs: [version, images]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name }}
      - name: Zip and attach
        env:
          VERSION: ${{ needs.version.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp -r deploy/compose "foodstack-compose-$VERSION"
          sed -i "s/^FOODSTACK_VERSION=.*/FOODSTACK_VERSION=$VERSION/" "foodstack-compose-$VERSION/.env.example"
          zip -qr "foodstack-compose-$VERSION.zip" "foodstack-compose-$VERSION"
          gh release upload "${{ github.event.release.tag_name }}" "foodstack-compose-$VERSION.zip" --clobber

  # Only lists what this release published (also on the run's summary page).
  published:
    needs: [version, charts, compose]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name }}
      - name: Published versions and names
        run: |
          .github/scripts/print-published.sh "${{ needs.version.outputs.version }}" \
            "${{ needs.version.outputs.version }} ${{ needs.version.outputs.minor }} latest" "${{ github.event.release.tag_name }}"
