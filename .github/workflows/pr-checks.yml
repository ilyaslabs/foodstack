name: PR checks

on:
  pull_request:
    branches: [main]

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # Every class-level test, the contract snapshots, the architecture rules and the integration
  # journeys in both topologies (Testing Strategy 11). Uses Docker on the runner for Testcontainers.
  backend:
    uses: ilyaslabs/cicd/.github/workflows/mvn-pr-checks.yml@main
    with:
      java-version: '25'

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm build

  # Both Helm charts lint and render valid Kubernetes objects in every topology, for the trial
  # values and a production-shaped install (TDD 18.1).
  charts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: azure/setup-helm@v4
        with:
          version: v3.19.0
      - name: Lint
        run: |
          helm lint k8s/helm/foodstack -f k8s/helm/foodstack/values-dev.yaml
          helm lint k8s/helm/foodstack -f k8s/helm/foodstack/ci/production-values.yaml
          helm lint k8s/helm/foodstack -f playground/k8s/values-playground.yaml
          helm lint k8s/helm/foodstack-observability
      - name: Validate the rendered objects
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz | tar xz kubeconform
          check() {
            ./kubeconform -strict -summary -kubernetes-version 1.31.0 -ignore-missing-schemas \
              -schema-location default \
              -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
          }
          for topology in monolith split microservices; do
            helm template fs k8s/helm/foodstack -n foodstack -f k8s/helm/foodstack/values-dev.yaml --set topology=$topology | check
          done
          helm template fs k8s/helm/foodstack -n foodstack -f k8s/helm/foodstack/ci/production-values.yaml --set topology=split | check
          for topology in monolith split microservices; do
            helm template foodstack k8s/helm/foodstack -n foodstack -f playground/k8s/values-playground.yaml --set topology=$topology | check
          done
          helm template obs k8s/helm/foodstack-observability -n foodstack-observability --set alertmanager.enabled=true | check

  # The release artefacts still build: the unit deployer zip and the images (not pushed).
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build the server and the unit deployer zip
        run: mvn -B -DskipTests -pl deploy/unit-deployer -am package
      - name: Build images
        run: |
          docker build -t foodstack-server:ci app/foodstack-server
          docker build -f frontend/docker/web.Dockerfile -t foodstack-web:ci frontend
          docker build -f frontend/docker/backoffice.Dockerfile -t foodstack-backoffice:ci frontend
