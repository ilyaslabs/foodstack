name: PR checks

on:
  pull_request:
    branches: [main]

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # Every class-level test, the contract snapshots, the architecture rules and the integration
  # journeys in both topologies (Testing Strategy 11). Uses Docker on the runner for Testcontainers.
  backend:
    uses: ilyaslabs/cicd/.github/workflows/mvn-pr-checks.yml@main
    with:
      java-version: '25'

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm build

  # Both Helm charts lint and render valid Kubernetes objects in every topology, for the trial
  # values and a production-shaped install (TDD 18.1).
  charts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: azure/setup-helm@v4
        with:
          version: v3.19.0
      - name: Lint
        run: |
          helm lint k8s/helm/foodstack -f k8s/helm/foodstack/values-dev.yaml
          helm lint k8s/helm/foodstack -f k8s/helm/foodstack/ci/production-values.yaml
          helm lint k8s/helm/foodstack-observability
      - name: Validate the rendered objects
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz | tar xz kubeconform
          check() {
            ./kubeconform -strict -summary -kubernetes-version 1.31.0 -ignore-missing-schemas \
              -schema-location default \
              -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
          }
          for topology in monolith split microservices; do
            helm template fs k8s/helm/foodstack -n foodstack -f k8s/helm/foodstack/values-dev.yaml --set topology=$topology | check
          done
          helm template fs k8s/helm/foodstack -n foodstack -f k8s/helm/foodstack/ci/production-values.yaml --set topology=split | check
          helm template obs k8s/helm/foodstack-observability -n foodstack-observability --set alertmanager.enabled=true | check
      - name: Per-service folders hold every object
        run: |
          for topology in monolith split microservices; do
            v=k8s/helm/foodstack/ci/production-values.yaml
            bash k8s/helm/foodstack/render.sh --offline --out "out-$topology" -n foodstack -f $v --set topology=$topology
            all=$(helm template foodstack k8s/helm/foodstack -n foodstack -f $v --set topology=$topology | grep -c '^kind: ')
            split=$(cat out-$topology/*/*.yaml | grep -c '^kind: ')
            [[ $all == "$split" ]] || { echo "$topology: $all objects rendered, $split in the folders"; exit 1; }
            ! grep -L 'foodstack.ilyaslabs.io/part:' out-$topology/*/*.yaml | grep . || { echo "objects without a part label"; exit 1; }
          done

  # The release images still build (not pushed), and the Docker Compose files are valid.
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build the server
        run: mvn -B -DskipTests -pl app/foodstack-server -am package
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Build the web app and the back office
        working-directory: frontend
        run: pnpm install --frozen-lockfile && pnpm build
      - name: Docker Compose files are valid
        working-directory: deploy/compose
        run: |
          cp .env.example .env    # as the guide says; the server reads it as its env_file
          docker compose config -q
          docker compose -f docker-compose.yml -f docker-compose.local.yml config -q
          docker run --rm -e FOODSTACK_SITES=:80 -e FOODSTACK_ADMIN_ROOT_HOST=x -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2.10-alpine caddy validate --config /etc/caddy/Caddyfile
          docker run --rm -e FOODSTACK_SITES=:80 -e FOODSTACK_ADMIN_ROOT_HOST=x -v "$PWD/../services/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2.10-alpine caddy validate --config /etc/caddy/Caddyfile
      - name: Build images
        run: |
          docker build -t foodstack-server:ci app/foodstack-server
          docker build -f frontend/docker/web.Dockerfile -t foodstack-web:ci frontend
          docker build -f frontend/docker/backoffice.Dockerfile -t foodstack-backoffice:ci frontend
