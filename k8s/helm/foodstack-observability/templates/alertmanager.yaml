{{- if .Values.alertmanager.enabled }}
{{- $n := include "obs.name" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $n }}-alertmanager
  labels: {{- include "obs.labels" . | nindent 4 }}
stringData:
  alertmanager.yml: |
    {{- toYaml .Values.alertmanager.config | nindent 4 }}
---
{{ include "obs.pvc" (list . "alertmanager" .Values.alertmanager.storage) }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $n }}-alertmanager
  labels: {{- include "obs.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: {{- include "obs.selector" (list . "alertmanager") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "obs.selector" (list . "alertmanager") | nindent 8 }}
      annotations:
        checksum/config: {{ toYaml .Values.alertmanager.config | sha256sum | trunc 16 }}
    spec:
      {{- include "obs.podSecurity" . | nindent 6 }}
      containers:
        - name: alertmanager
          image: {{ .Values.alertmanager.image }}
          args:
            - --config.file=/etc/alertmanager/alertmanager.yml
            - --storage.path=/alertmanager
            - --cluster.listen-address=
          ports: [{ name: http, containerPort: 9093 }]
          readinessProbe: { httpGet: { path: /-/ready, port: http } }
          resources: {{- toYaml .Values.alertmanager.resources | nindent 12 }}
          {{- include "obs.containerSecurity" . | nindent 10 }}
          volumeMounts:
            - { name: config, mountPath: /etc/alertmanager }
            - { name: data, mountPath: /alertmanager }
      volumes:
        - { name: config, secret: { secretName: {{ $n }}-alertmanager } }
        - { name: data, persistentVolumeClaim: { claimName: {{ $n }}-alertmanager } }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $n }}-alertmanager
  labels: {{- include "obs.labels" . | nindent 4 }}
spec:
  selector: {{- include "obs.selector" (list . "alertmanager") | nindent 4 }}
  ports: [{ name: http, port: 9093, targetPort: http }]
{{- end }}
