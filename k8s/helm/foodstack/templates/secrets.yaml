{{- /* The server's keys (TDD 18). On a real install the operator gives them in secrets.* (or names
       their own Secret in secrets.existingSecret): the chart never makes or replaces them, so every
       tool that renders it (helm, Argo CD, Flux, render.sh) writes the same Secret. Only a trial
       install (values-dev.yaml) generates them, once, and looks them up on upgrades. Created as a
       hook before the migrations Job, and kept by helm uninstall. */ -}}
{{- if not .Values.secrets.existingSecret }}
{{- $name := include "foodstack.secretName" . }}
{{- $s := .Values.secrets }}
{{- $keys := dict }}
{{- if .Values.dev.enabled }}
{{- $old := (lookup "v1" "Secret" .Release.Namespace $name).data | default dict }}
{{- if and .Release.IsUpgrade (not $old) }}
{{- fail (printf "Secret %s was not found during the upgrade. New keys would make the stored personal data and every sign-in unreadable, so the upgrade stops. Restore the Secret, or name it in secrets.existingSecret." $name) }}
{{- end }}
{{- $_ := set $keys "FOODSTACK_SIGNING_KEYS" (get $old "FOODSTACK_SIGNING_KEYS" | default (genPrivateKey "ecdsa" | replace "\n" "" | b64enc)) }}
{{- $_ := set $keys "FOODSTACK_PII_KEY" (get $old "FOODSTACK_PII_KEY" | default (randBytes 32 | b64enc)) }}
{{- $_ := set $keys "FOODSTACK_INTERNAL_TOKEN" (get $old "FOODSTACK_INTERNAL_TOKEN" | default (randAlphaNum 48 | b64enc)) }}
{{- $_ := set $keys "FOODSTACK_SERVICE_CLIENT_SECRET" (get $old "FOODSTACK_SERVICE_CLIENT_SECRET" | default (randAlphaNum 48 | b64enc)) }}
{{- $_ := set $keys "FOODSTACK_ADMIN_PASSWORD" (get $old "FOODSTACK_ADMIN_PASSWORD" | default (randAlphaNum 20 | b64enc)) }}
{{- else }}
{{- $how := "(or name your own Secret in secrets.existingSecret; Kubernetes guide, section 6)" }}
{{- $_ := set $keys "FOODSTACK_SIGNING_KEYS" (required (printf "secrets.signingKey: the token signing key, made once with: openssl genpkey -algorithm EC -pkeyopt ec_paramgen_curve:P-256 | openssl pkcs8 -topk8 -nocrypt %s" $how) $s.signingKey | b64enc) }}
{{- $_ := set $keys "FOODSTACK_PII_KEY" (required (printf "secrets.piiKey: the personal-data key, made once with: openssl rand -base64 32. Keep a copy outside the cluster: without it stored personal data cannot be read %s" $how) $s.piiKey | b64enc) }}
{{- $_ := set $keys "FOODSTACK_INTERNAL_TOKEN" (required (printf "secrets.internalToken: made once with: openssl rand -hex 24 %s" $how) $s.internalToken | b64enc) }}
{{- $_ := set $keys "FOODSTACK_SERVICE_CLIENT_SECRET" (required (printf "secrets.serviceClientSecret: made once with: openssl rand -hex 24 %s" $how) $s.serviceClientSecret | b64enc) }}
{{- $_ := set $keys "FOODSTACK_ADMIN_PASSWORD" (required (printf "secrets.adminPassword: the first administrator's password, at least 12 characters %s" $how) $s.adminPassword | b64enc) }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels: {{- include "foodstack.partLabels" (list . "secrets") | nindent 4 }}
  annotations: {{- include "foodstack.hookAnnotations" . | nindent 4 }}
type: Opaque
data:
  {{- range $k := list "FOODSTACK_SIGNING_KEYS" "FOODSTACK_PII_KEY" "FOODSTACK_INTERNAL_TOKEN" "FOODSTACK_SERVICE_CLIENT_SECRET" "FOODSTACK_ADMIN_PASSWORD" }}
  {{ $k }}: {{ get $keys $k }}
  {{- end }}
{{- end }}
---
{{- if not .Values.datastores.existingSecret }}
{{- $ds := .Values.datastores }}
{{- $fn := include "foodstack.fullname" . }}
{{- $name := include "foodstack.datastoreSecretName" . }}
{{- $old := (lookup "v1" "Secret" .Release.Namespace $name).data | default dict }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels: {{- include "foodstack.partLabels" (list . "secrets") | nindent 4 }}
  annotations: {{- include "foodstack.hookAnnotations" . | nindent 4 }}
type: Opaque
data:
{{- if .Values.dev.enabled }}
  {{- $mongo := get $old "MONGO_PASSWORD" | default (randAlphaNum 24 | b64enc) }}
  {{- $redis := get $old "REDIS_PASSWORD" | default (randAlphaNum 24 | b64enc) }}
  {{- $es := get $old "ELASTICSEARCH_PASSWORD" | default (randAlphaNum 24 | b64enc) }}
  {{- $s3 := get $old "S3_SECRET_KEY" | default (randAlphaNum 32 | b64enc) }}
  MONGO_PASSWORD: {{ $mongo }}
  REDIS_PASSWORD: {{ $redis }}
  MONGO_KEYFILE: {{ get $old "MONGO_KEYFILE" | default (randAlphaNum 64 | b64enc) }}
  MONGODB_URI: {{ printf "mongodb://foodstack:%s@%s-mongodb:27017/?replicaSet=rs0&authSource=admin" ($mongo | b64dec) $fn | b64enc }}
  REDIS_URL: {{ printf "redis://:%s@%s-redis:6379" ($redis | b64dec) $fn | b64enc }}
  ELASTICSEARCH_PASSWORD: {{ $es }}
  S3_ACCESS_KEY: {{ "foodstack" | b64enc }}
  S3_SECRET_KEY: {{ $s3 }}
{{- else }}
  {{- if not $ds.mongodb.uri }}{{ fail "datastores.mongodb.uri is required (or datastores.existingSecret, or values-dev.yaml for a trial)" }}{{ end }}
  {{- if not $ds.redis.url }}{{ fail "datastores.redis.url is required (or datastores.existingSecret)" }}{{ end }}
  {{- if not $ds.kafka.bootstrap }}{{ fail "datastores.kafka.bootstrap is required" }}{{ end }}
  {{- if not $ds.elasticsearch.uris }}{{ fail "datastores.elasticsearch.uris is required" }}{{ end }}
  MONGODB_URI: {{ $ds.mongodb.uri | b64enc }}
  REDIS_URL: {{ $ds.redis.url | b64enc }}
  ELASTICSEARCH_PASSWORD: {{ $ds.elasticsearch.password | b64enc }}
  S3_ACCESS_KEY: {{ $ds.s3.accessKey | b64enc }}
  S3_SECRET_KEY: {{ $ds.s3.secretKey | b64enc }}
{{- end }}
{{- end }}
