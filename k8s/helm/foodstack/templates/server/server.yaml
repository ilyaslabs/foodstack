{{- /*
  One Deployment per entry of the topology (TDD 18.2), each with its Service, ServiceAccount,
  Module-Switch ConfigMap, HorizontalPodAutoscaler and PodDisruptionBudget. Modules the Deployment
  runs are local; every other module is called over HTTP on its owner's internal port 8081.
*/ -}}
{{- $root := . -}}
{{- $deployments := include "foodstack.deployments" . | fromYaml -}}
{{- $several := gt (len $deployments) 1 -}}
{{- $identityOwner := include "foodstack.ownerOf" (list $deployments "identity") -}}
{{- $all := splitList " " (include "foodstack.modules" .) -}}
{{- range $name, $d := $deployments }}
{{- $full := include "foodstack.serverName" (list $root $name) }}
{{- $labels := dict "app.kubernetes.io/name" "foodstack-server" "app.kubernetes.io/component" $name "app.kubernetes.io/instance" $root.Release.Name }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $full }}
  labels: {{- include "foodstack.labels" $root | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $full }}
  labels: {{- include "foodstack.labels" $root | nindent 4 }}
data:
  application-deployment.yaml: |
    # Generated by the Helm chart for Deployment "{{ $name }}" (topology {{ $root.Values.topology }}).
    module-switch:
      modules:
      {{- range $module := $all }}
      {{- if has $module $d.modules }}
        {{ $module }}: { mode: local }
      {{- else }}
        {{ $module }}:
          mode: http
          url: http://{{ include "foodstack.serverHost" (list $root (include "foodstack.ownerOf" (list $deployments $module))) }}:8081
          token: ${FOODSTACK_INTERNAL_TOKEN}
      {{- end }}
      {{- end }}
      {{- if $several }}
      expose:
        port: 8081
        modules: [{{ join ", " $d.modules }}]
        token: ${FOODSTACK_INTERNAL_TOKEN}
      {{- end }}
    {{- if ne $identityOwner $name }}
    foodstack:
      security:
        # tokens are checked with the identity Deployment's keys, fetched inside the cluster
        jwk-set-uri: http://{{ include "foodstack.serverHost" (list $root $identityOwner) }}:8080/oauth2/jwks
    {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $full }}
  labels:
    {{- include "foodstack.labels" $root | nindent 4 }}
    {{- if and $root.Values.mesh.enabled $root.Values.mesh.waypoint.enabled }}
    istio.io/use-waypoint: {{ include "foodstack.waypointName" $root }}
    istio.io/ingress-use-waypoint: "true"
    {{- end }}
spec:
  selector: {{- toYaml $labels | nindent 4 }}
  ports:
    - { name: http, port: 8080, targetPort: http, appProtocol: http }
    {{- if $several }}
    - { name: internal, port: 8081, targetPort: internal, appProtocol: http }
    {{- end }}
    - { name: management, port: 8082, targetPort: management, appProtocol: http }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $full }}
  labels: {{- include "foodstack.labels" $root | nindent 4 }}
spec:
  {{- if not $d.autoscaling.enabled }}
  replicas: {{ $d.replicas }}
  {{- end }}
  revisionHistoryLimit: 3
  selector:
    matchLabels: {{- toYaml $labels | nindent 6 }}
  strategy:
    rollingUpdate: { maxSurge: 25%, maxUnavailable: 0 }
  template:
    metadata:
      labels:
        {{- toYaml $labels | nindent 8 }}
        {{- include "foodstack.podMeshLabels" $root | nindent 8 }}
      annotations:
        checksum/config: {{ toYaml $d | sha256sum | trunc 16 }}
        prometheus.io/scrape: "true"
        prometheus.io/port: "8082"
        prometheus.io/path: /actuator/prometheus
    spec:
      serviceAccountName: {{ $full }}
      automountServiceAccountToken: false
      {{- with $root.Values.image.pullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      # graceful shutdown drains live streams (30 s) after the endpoints are removed
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {{- toYaml $labels | nindent 14 }}
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {{- toYaml $labels | nindent 14 }}
      {{- with $d.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $d.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $d.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: server
          image: {{ include "foodstack.image" (list $root $root.Values.server.image) }}
          imagePullPolicy: {{ $root.Values.image.pullPolicy }}
          ports:
            - { name: http, containerPort: 8080 }
            {{- if $several }}
            - { name: internal, containerPort: 8081 }
            {{- end }}
            - { name: management, containerPort: 8082 }
          env:
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:MaxRAMPercentage={{ $root.Values.server.maxRamPercentage }} --enable-native-access=ALL-UNNAMED"
            - name: SPRING_APPLICATION_NAME
              value: {{ $full }}
            - name: SPRING_CONFIG_ADDITIONAL_LOCATION
              value: optional:file:/config/
            - name: SPRING_PROFILES_ACTIVE
              value: deployment
            - name: MANAGEMENT_SERVER_PORT
              value: "8082"
            - name: MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE
              value: health,info,prometheus
            {{- with $root.Values.server.logFormat }}
            # one JSON object per line with traceId and spanId, for Loki (TDD 18.5)
            - name: LOGGING_STRUCTURED_FORMAT_CONSOLE
              value: {{ . | quote }}
            {{- end }}
            # the hook Job migrated before this pod started; trial datastores migrate here
            - name: FOODSTACK_MONGODB_MIGRATIONS_ENABLED
              value: {{ not (include "foodstack.migrationsJob" $root | eq "true") | quote }}
            - name: FOODSTACK_KAFKA_LISTENER_CONCURRENCY
              value: {{ $d.kafkaConcurrency | quote }}
            - name: FOODSTACK_TRACING_EXPORT
              value: {{ $root.Values.server.tracing.enabled | quote }}
            - name: FOODSTACK_OTLP_ENDPOINT
              value: {{ $root.Values.server.tracing.endpoint | quote }}
            - name: FOODSTACK_TRACING_SAMPLING
              value: {{ $root.Values.server.tracing.sampling | quote }}
            {{- range $k, $v := (include "foodstack.serverConfig" $root | fromYaml) }}
            - { name: {{ $k }}, value: {{ $v | quote }} }
            {{- end }}
            {{- range $k, $v := $d.env }}
            - { name: {{ $k }}, value: {{ $v | quote }} }
            {{- end }}
            {{- include "foodstack.datastoreEnv" $root | nindent 12 }}
            {{- range $module := $d.modules }}
            {{- with get $root.Values.server.moduleDatastores $module }}
            - name: FOODSTACK_MODULES_{{ upper $module }}_MONGODB_URI
              valueFrom: { secretKeyRef: { name: {{ .mongodbUriSecret }}, key: MONGODB_URI } }
            {{- end }}
            {{- end }}
          {{- with $root.Values.server.envFromSecrets }}
          envFrom:
            {{- range . }}
            - secretRef: { name: {{ . }} }
            {{- end }}
          {{- end }}
          volumeMounts:
            - { name: config, mountPath: /config, readOnly: true }
            - { name: tmp, mountPath: /tmp }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          resources: {{- toYaml $d.resources | nindent 12 }}
          startupProbe:
            httpGet: { path: /actuator/health/liveness, port: management }
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: management }
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: management }
            periodSeconds: 5
            failureThreshold: 3
          lifecycle:
            # let the endpoints update before the server stops taking requests
            preStop: { sleep: { seconds: 5 } }
      volumes:
        - name: config
          configMap: { name: {{ $full }} }
        - name: tmp
          emptyDir: {}
{{- if $d.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ $full }}
  labels: {{- include "foodstack.labels" $root | nindent 4 }}
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: {{ $full }} }
  minReplicas: {{ $d.autoscaling.min }}
  maxReplicas: {{ $d.autoscaling.max }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: {{ $d.autoscaling.targetCPU }} }
{{- end }}
{{- if $d.pdb }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $full }}
  labels: {{- include "foodstack.labels" $root | nindent 4 }}
spec:
  minAvailable: {{ $d.pdb.minAvailable }}
  selector:
    matchLabels: {{- toYaml $labels | nindent 6 }}
{{- end }}
{{- end }}
