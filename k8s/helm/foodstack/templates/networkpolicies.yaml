{{- /* Plain NetworkPolicies (TDD 18.3): who may open connections to which pods. With Istio
       ambient, mesh traffic arrives on the HBONE port 15008 and kubelet probes come from
       169.254.7.127, so both are allowed too. */ -}}
{{- if .Values.networkPolicies.enabled }}
{{- $root := . }}
{{- $fn := include "foodstack.fullname" . }}
{{- $rel := .Release.Name }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fn }}-server
  labels: {{- include "foodstack.partLabels" (list . "shared") | nindent 4 }}
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: foodstack-server, app.kubernetes.io/instance: {{ $rel }} }
  policyTypes: [Ingress]
  ingress:
    - from:
        {{- include "foodstack.np.gateways" . | nindent 8 }}
        {{- include "foodstack.np.pods" (list . (list "foodstack-server" "foodstack-web")) | nindent 8 }}
      ports: [{ port: 8080 }, { port: 8081 }]
    # health and metrics
    - ports: [{ port: 8082 }]
    {{- include "foodstack.np.mesh" . | nindent 4 }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fn }}-frontends
  labels: {{- include "foodstack.partLabels" (list . "shared") | nindent 4 }}
spec:
  podSelector:
    matchExpressions:
      - { key: app.kubernetes.io/instance, operator: In, values: [{{ $rel }}] }
      - { key: app.kubernetes.io/name, operator: In, values: [foodstack-web, foodstack-backoffice] }
  policyTypes: [Ingress]
  ingress:
    - from: {{- include "foodstack.np.gateways" . | nindent 8 }}
      ports: [{ port: 4000 }, { port: 8080 }]
    {{- include "foodstack.np.mesh" . | nindent 4 }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fn }}-ratelimit
  labels: {{- include "foodstack.partLabels" (list . "shared") | nindent 4 }}
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: foodstack-ratelimit, app.kubernetes.io/instance: {{ $rel }} }
  policyTypes: [Ingress]
  ingress:
    - from: {{- include "foodstack.np.gateways" . | nindent 8 }}
      ports: [{ port: 8081 }]
    {{- include "foodstack.np.mesh" . | nindent 4 }}
{{- if .Values.dev.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fn }}-datastores
  labels: {{- include "foodstack.partLabels" (list . "shared") | nindent 4 }}
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/component: datastore, app.kubernetes.io/instance: {{ $rel }} }
  policyTypes: [Ingress]
  ingress:
    - from:
        {{- include "foodstack.np.pods" (list . (list "foodstack-server" "foodstack-migrations" "foodstack-ratelimit" "foodstack-mongodb" "foodstack-kafka")) | nindent 8 }}
    - from: {{- include "foodstack.np.gateways" . | nindent 8 }}
      ports: [{ port: 9000 }]
    {{- include "foodstack.np.mesh" . | nindent 4 }}
{{- end }}
{{- end }}
