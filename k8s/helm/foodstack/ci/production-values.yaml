# CI only: a production-shaped install (managed datastores, HTTPS through cert-manager) so the
# chart checks render the paths the trial values skip. Not a template for a real install.
secrets:
  adminEmail: ops@example.com
datastores:
  mongodb: { uri: "mongodb+srv://foodstack:secret@mongo.example.com/", sharding: true }
  redis: { url: "rediss://:secret@redis.example.com:6380" }
  kafka: { bootstrap: "kafka-1.example.com:9092,kafka-2.example.com:9092" }
  elasticsearch: { uris: "https://es.example.com:9200", password: secret }
  s3:
    endpoint: https://s3.eu-west-1.amazonaws.com
    region: eu-west-1
    pathStyle: false
    publicBaseUrl: https://cdn.example.com
    accessKey: key
    secretKey: secret
    publicBucket: example-foodstack-public
    privateBucket: example-foodstack-private
maps:
  geocoding: { provider: google, countryCodes: pk }
  routing: { provider: google }
  tiles: { url: "https://tiles.example.com/{z}/{x}/{y}.png?key=abc", attribution: "© Example © OpenStreetMap contributors" }
