# Trials only (install.sh --local): S3-compatible storage on this machine, so a trial needs no
# storage account. A real install keeps photos and files in the operator's buckets instead
# (handbook guide 12), and does not use this file.

services:
  storage:
    restart: unless-stopped
    networks: [foodstack]
    image: rustfs/rustfs:1.0.4
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY}
    volumes:
      - storage:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/health > /dev/null || wget -qO- http://localhost:9000/health > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20

  server:
    environment:
      S3_ENDPOINT: http://storage:9000
      S3_CREATE_BUCKETS: "true"
      # Browsers reach the buckets through the proxy on the trial's own address, so no CORS.
      S3_CHECK_ORIGINS: ""
    depends_on:
      storage:
        condition: service_healthy

volumes:
  storage:
