# FoodStack service "promotion": Promotions and coupons.
#
# Needs:    MongoDB (database foodstack_promotion), Redis, Kafka.
# Outside:  none.
# Calls:    no other service (on their internal port 8081).
# Answers:  /api/v1/promotions, /api/v1/coupons
#
# Fill in every value marked REPLACE and every example.com address, then run it:
#   docker run -d --name promotion -p 8080:8080 -p 8081:8081 \
#     -v $PWD/promotion.yml:/app/config/application.yml:ro ilyasdotdev/ilyaslabs-foodstack:server-<version>
# or, with Java 25: java -jar foodstack-server.jar --spring.config.additional-location=file:promotion.yml
# The README next to this file lists the start order and the proxy routes. Every value can also
# come from the environment: write ${MY_VARIABLE} instead of the value.

server:
  port: 8080        # the public API, behind your proxy

spring:
  mongodb:
    # The cluster (a replica set); this service uses its own database foodstack_promotion on it.
    uri: mongodb://foodstack:REPLACE-with-the-password@mongodb.internal:27017/?replicaSet=rs0&authSource=admin
  data:
    redis:
      # rediss://... for TLS. Every service uses the same Redis.
      url: redis://:REPLACE-with-the-password@redis.internal:6379
  kafka:
    bootstrap-servers: kafka-1.internal:9092,kafka-2.internal:9092,kafka-3.internal:9092

# Which service runs which module. This one runs promotion; every other module is called on its
# service's internal port. Change the addresses to where you run them.
module-switch:
  modules:
    identity: { mode: http, url: "http://identity.internal:8081", token: REPLACE-with-the-internal-token }
    settings: { mode: http, url: "http://settings.internal:8081", token: REPLACE-with-the-internal-token }
    media: { mode: http, url: "http://media.internal:8081", token: REPLACE-with-the-internal-token }
    geo: { mode: http, url: "http://geo.internal:8081", token: REPLACE-with-the-internal-token }
    store: { mode: http, url: "http://store.internal:8081", token: REPLACE-with-the-internal-token }
    search: { mode: http, url: "http://search.internal:8081", token: REPLACE-with-the-internal-token }
    promotion: { mode: local }
    cart: { mode: http, url: "http://cart.internal:8081", token: REPLACE-with-the-internal-token }
    payment: { mode: http, url: "http://payment.internal:8081", token: REPLACE-with-the-internal-token }
    order: { mode: http, url: "http://order.internal:8081", token: REPLACE-with-the-internal-token }
    rider: { mode: http, url: "http://rider.internal:8081", token: REPLACE-with-the-internal-token }
    dispatch: { mode: http, url: "http://dispatch.internal:8081", token: REPLACE-with-the-internal-token }
    notification: { mode: http, url: "http://notification.internal:8081", token: REPLACE-with-the-internal-token }
    ledger: { mode: http, url: "http://ledger.internal:8081", token: REPLACE-with-the-internal-token }
    review: { mode: http, url: "http://review.internal:8081", token: REPLACE-with-the-internal-token }
  # The internal port other services call. The token is the same on every service:
  #   openssl rand -hex 24
  expose:
    port: 8081
    modules: [promotion]
    token: REPLACE-with-the-internal-token

foodstack:
  environment: production
  kafka:
    # Partitions of the topics this service creates, and copies of each (3 on a 3-broker cluster).
    topic-partitions: 24
    replication-factor: 3
  security:
    # The public API address: the issuer of every sign-in token. The same on every service.
    issuer: https://api.example.com
    # Where this service gets the token keys and its own service tokens: the identity service.
    jwk-set-uri: http://identity.internal:8080/oauth2/jwks
    token-uri: http://identity.internal:8080/oauth2/token
    # The same on every service: openssl rand -hex 24
    service-client-secret: REPLACE-with-the-service-client-secret
    # The personal-data key, the same on every service (every one checks it on start):
    #   openssl rand -base64 32
    # Keep a copy outside the server: without it stored personal data cannot be read.
    pii-key: REPLACE-with-the-personal-data-key
  # Optional: put this service's database on a cluster of its own (handbook runbook 45).
  # modules:
  #   promotion:
  #     mongodb:
  #       uri: mongodb://...
