# FoodStack on one machine with Docker Compose: the proxy (HTTPS), the server with every module,
# the customer web app, the back office, and the four datastores. See README.md next to this file.
#
#   cp .env.example .env              # then fill in .env and config/application.yml
#   docker compose up -d
#
# A trial on your own computer, with photos and emails kept on it:
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up -d
name: foodstack

x-service: &service
  restart: unless-stopped
  networks: [foodstack]
  logging:
    driver: json-file
    options:
      max-size: 20m
      max-file: "5"

services:
  proxy:
    <<: *service
    image: caddy:2.10-alpine
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      FOODSTACK_SITES: ${FOODSTACK_SITES}
      FOODSTACK_ADMIN_ROOT_HOST: ${FOODSTACK_ADMIN_ROOT_HOST}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy:/data
    depends_on:
      server: { condition: service_healthy }
      web: { condition: service_healthy }
      backoffice: { condition: service_healthy }

  server:
    <<: *service
    image: ilyasdotdev/ilyaslabs-foodstack:server-${FOODSTACK_VERSION}
    # The datastore passwords for application.yml
    env_file: .env
    environment:
      JAVA_TOOL_OPTIONS: -Xmx${JAVA_HEAP:-2g} --enable-native-access=ALL-UNNAMED
      # Every setting is read from config/application.yml (and push/fcm.json if you add it). Change it,
      # then  docker compose restart server
      SPRING_CONFIG_ADDITIONAL_LOCATION: optional:file:/config/
    volumes:
      - ./config:/config:ro
    depends_on:
      mongodb: { condition: service_healthy }
      redis: { condition: service_healthy }
      kafka: { condition: service_healthy }
      elasticsearch: { condition: service_healthy }

  web:
    <<: *service
    image: ilyasdotdev/ilyaslabs-foodstack:web-${FOODSTACK_VERSION}
    environment:
      PORT: "4000"
      FOODSTACK_API_URL: ""
      FOODSTACK_INTERNAL_API_URL: http://server:8080
      FOODSTACK_ALLOWED_HOSTS: ${FOODSTACK_HOSTNAMES}
      MAP_TILE_URL: ${MAP_TILE_URL}
      MAP_ATTRIBUTION: ${MAP_ATTRIBUTION}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4000/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  backoffice:
    <<: *service
    image: ilyasdotdev/ilyaslabs-foodstack:backoffice-${FOODSTACK_VERSION}
    environment:
      FOODSTACK_API_URL: ""
      MAP_TILE_URL: ${MAP_TILE_URL}
      MAP_TILE_ORIGIN: ${MAP_TILE_ORIGIN}
      MAP_ATTRIBUTION: ${MAP_ATTRIBUTION}
      MEDIA_ORIGINS: ${MEDIA_ORIGINS}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/admin/config.json || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  mongodb:
    <<: *service
    image: mongo:8.2
    # A one-member replica set with passwords needs a key file; it is made once, in the data volume.
    entrypoint:
      - bash
      - -c
      - |
        f=/data/db/.replica-keyfile
        [ -s "$$f" ] || openssl rand -base64 756 > "$$f"
        chown mongodb:mongodb "$$f" && chmod 400 "$$f"
        exec docker-entrypoint.sh mongod --replSet rs0 --bind_ip_all --keyFile "$$f"
    environment:
      MONGO_INITDB_ROOT_USERNAME: foodstack
      MONGO_INITDB_ROOT_PASSWORD: ${MONGODB_PASSWORD}
    volumes:
      - mongodb:/data/db
    healthcheck:
      # also starts the replica set on the first run
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet -u foodstack -p "$$MONGO_INITDB_ROOT_PASSWORD" --authenticationDatabase admin --eval
          "try { rs.status() } catch (e) { rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'mongodb:27017'}]}) }; db.hello().isWritablePrimary"
          | grep -q true || exit 1
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 20s

  redis:
    <<: *service
    image: redis:8.2-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 20

  kafka:
    <<: *service
    image: apache/kafka:4.1.1
    environment:
      CLUSTER_ID: foodstack-compose-kafka-01
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xmx${KAFKA_HEAP:-1g} -Xms${KAFKA_HEAP:-1g}
    volumes:
      - kafka:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 20s

  elasticsearch:
    <<: *service
    image: elasticsearch:9.4.0
    environment:
      discovery.type: single-node
      xpack.security.enabled: "true"
      xpack.security.http.ssl.enabled: "false"
      node.store.allow_mmap: "false"
      ELASTIC_PASSWORD: ${ELASTICSEARCH_PASSWORD}
      ES_JAVA_OPTS: -Xms${ES_HEAP:-1g} -Xmx${ES_HEAP:-1g}
    volumes:
      - elasticsearch:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -u elastic:$${ELASTIC_PASSWORD} http://localhost:9200/_cluster/health > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30

volumes:
  mongodb:
  redis:
  kafka:
  elasticsearch:
  caddy:

networks:
  foodstack:
    name: foodstack
