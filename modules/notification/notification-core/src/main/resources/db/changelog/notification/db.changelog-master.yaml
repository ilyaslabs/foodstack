# Liquibase changelog of the notification module (database foodstack_notification). Shard keys are applied by
# NotificationConfiguration (TDD 6.3) and listed next to each collection.
databaseChangeLog:
  - include:
      file: db/changelog/platform/outbox-inbox.yaml
  - changeSet:
      id: notification-1
      author: foodstack
      comment: "notification_inbox (shard key { userId: hashed }, kept 180 days), notification_deliveries (shard key { _id: hashed }, kept 90 days), notification_preferences (_id = user id, { _id: hashed })"
      changes:
        - createCollection:
            collectionName: notification_inbox
        - createIndex:
            collectionName: notification_inbox
            keys: '{ "userId": 1, "createdAt": -1 }'
            options: '{ "name": "user_newest" }'
        - createIndex:
            collectionName: notification_inbox
            keys: '{ "createdAt": 1 }'
            options: '{ "name": "expiry", "expireAfterSeconds": 15552000 }'
        - createCollection:
            collectionName: notification_deliveries
        - createIndex:
            collectionName: notification_deliveries
            keys: '{ "status": 1, "nextAttemptAt": 1 }'
            options: '{ "name": "due" }'
        - createIndex:
            collectionName: notification_deliveries
            keys: '{ "createdAt": -1 }'
            options: '{ "name": "newest" }'
        - createIndex:
            collectionName: notification_deliveries
            keys: '{ "createdAt": 1 }'
            options: '{ "name": "expiry", "expireAfterSeconds": 7776000 }'
        - createCollection:
            collectionName: notification_preferences
  - changeSet:
      id: notification-2
      author: foodstack
      comment: "notification_devices: push tokens (FCM), _id = SHA-256 of the token, shard key { userId: hashed }"
      changes:
        - createCollection:
            collectionName: notification_devices
        - createIndex:
            collectionName: notification_devices
            keys: '{ "userId": 1 }'
            options: '{ "name": "user" }'
  - changeSet:
      id: notification-3
      author: foodstack
      comment: "Push messages join the delivery log, sent by every replica's senders (TDD 7.5); the admin log lists emails"
      changes:
        - createIndex:
            collectionName: notification_deliveries
            keys: '{ "status": 1, "channel": 1, "nextAttemptAt": 1 }'
            options: '{ "name": "due_by_channel" }'
        - createIndex:
            collectionName: notification_deliveries
            keys: '{ "channel": 1, "createdAt": -1 }'
            options: '{ "name": "channel_newest" }'
  - changeSet:
      id: notification-4
      author: foodstack
      comment: "M4 account deletion (PRD ID-7): a deleted user's delivery log entries are found by user"
      changes:
        - createIndex:
            collectionName: notification_deliveries
            keys: '{ "userId": 1 }'
            options: '{ "name": "user" }'
  - changeSet:
      id: notification-5
      author: foodstack
      comment: "M4 template editor (PRD NO-2): the operator's own wording per message and language, _id = template:language; a few dozen documents, so unsharded"
      changes:
        - createCollection:
            collectionName: notification_templates
