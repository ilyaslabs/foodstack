# Liquibase changelog of the promotion module (database foodstack_promotion). Shard keys are applied by
# PromotionConfiguration (TDD 6.3) and listed next to each collection.
databaseChangeLog:
  - include:
      file: db/changelog/platform/outbox-inbox.yaml
  - changeSet:
      id: promotion-1
      author: foodstack
      comment: "promotion_promotions (shard key { _id: hashed }) and promotion_codes (the code is the _id, so it is unique; { _id: hashed })"
      changes:
        - createCollection:
            collectionName: promotion_promotions
        - createIndex:
            collectionName: promotion_promotions
            keys: '{ "brandId": 1, "_id": -1 }'
            options: '{ "name": "brand_newest" }'
        - createCollection:
            collectionName: promotion_codes
  - changeSet:
      id: promotion-2
      author: foodstack
      comment: "coupon uses: promotion_redemptions (_id = order id), promotion_customer_usage (_id = promotionId:customerId), promotion_customers (_id = customer id); all { _id: hashed }"
      changes:
        - createCollection:
            collectionName: promotion_redemptions
        - createCollection:
            collectionName: promotion_customer_usage
        - createCollection:
            collectionName: promotion_customers
  - changeSet:
      id: promotion-3
      author: foodstack
      comment: "Uses of unlimited coupons are counted from their redemptions for the back office (TDD 7.5)"
      changes:
        - createIndex:
            collectionName: promotion_redemptions
            keys: '{ "promotionId": 1, "status": 1 }'
            options: '{ "name": "promotion_status" }'
  - changeSet:
      id: promotion-4
      author: foodstack
      comment: "promotion_brand_rules ({ _id: hashed }): whether each brand lets branch managers create promotions (PRD BB-11)"
      changes:
        - createCollection:
            collectionName: promotion_brand_rules
