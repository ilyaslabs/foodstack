<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in</title>
  <style>
    :root {
      --primary: #D84315; --on-primary: #fff;
      --page: #f6f6f8; --card: #fff; --text: #1c1b1f; --muted: #5f5f66; --line: #d9d9de; --error: #b3261e;
      --font: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      :root { --page: #111114; --card: #1c1c20; --text: #e6e1e5; --muted: #a8a4ab; --line: #3a3a40; --error: #f2b8b5; }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
      background: radial-gradient(120% 70% at 50% 0%, color-mix(in srgb, var(--primary) 14%, transparent), transparent 70%), var(--page);
      color: var(--text); font-family: var(--font); -webkit-font-smoothing: antialiased;
    }
    main {
      width: min(420px, 100%); padding: 40px 32px 32px; border-radius: 24px;
      background: var(--card); border: 1px solid var(--line);
      box-shadow: 0 1px 2px rgb(0 0 0 / 6%), 0 12px 32px rgb(0 0 0 / 8%);
    }
    @media (max-width: 480px) { main { padding: 32px 20px 24px; } }
    header { text-align: center; margin-block-end: 28px; }
    header img { width: 64px; height: 64px; object-fit: cover; border-radius: 16px; margin-block-end: 12px; }
    h1 { font-size: 1.5rem; line-height: 1.25; font-weight: 650; margin: 0 0 6px; }
    .tagline { margin: 0; color: var(--muted); font-size: .95rem; }
    .intro { margin: 0 0 8px; font-size: .95rem; color: var(--muted); text-align: center; }
    label { display: block; font-size: .875rem; font-weight: 500; margin-block: 18px 6px; }
    input {
      width: 100%; height: 48px; padding: 0 14px; font: inherit; font-size: 1rem; color: inherit;
      background: transparent; border: 1px solid var(--line); border-radius: 12px; transition: border-color .15s, box-shadow .15s;
    }
    input:hover { border-color: var(--muted); }
    input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px color-mix(in srgb, var(--primary) 22%, transparent); }
    button {
      width: 100%; height: 48px; margin-block-start: 28px; font: inherit; font-size: 1rem; font-weight: 600;
      border: 0; border-radius: 999px; background: var(--primary); color: var(--on-primary); cursor: pointer; transition: filter .15s;
    }
    button:hover { filter: brightness(1.08); }
    button:focus-visible { outline: 3px solid color-mix(in srgb, var(--primary) 40%, transparent); outline-offset: 2px; }
    .message { margin: 0 0 4px; padding: 12px 14px; border-radius: 12px; font-size: .9rem; background: color-mix(in srgb, var(--primary) 10%, transparent); }
    .error { color: var(--error); background: color-mix(in srgb, var(--error) 10%, transparent); }
  </style>
  <script src="/login/branding.js" defer></script>
</head>
<body>
  <main>
    <header>
      <img id="logo" alt="" hidden>
      <h1 id="brand-name">Sign in</h1>
      <p class="tagline" id="brand-tagline"></p>
    </header>
    <p class="intro">Sign in to continue</p>
    {{message}}
    <form method="post" action="/login">
      <input type="hidden" name="{{csrfParameter}}" value="{{csrfToken}}">
      <label for="username">Email</label>
      <input id="username" name="username" type="email" autocomplete="username" required autofocus>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button type="submit">Sign in</button>
    </form>
  </main>
</body>
</html>
