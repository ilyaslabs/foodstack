# Liquibase changelog of the dispatch module (database foodstack_dispatch). Shard keys are applied by
# DispatchConfiguration (TDD 6.3) and listed next to each collection.
databaseChangeLog:
  - include:
      file: db/changelog/platform/outbox-inbox.yaml
  - changeSet:
      id: dispatch-1
      author: foodstack
      comment: "dispatch_jobs ({ _id: hashed }) and the open-job projection dispatch_active ({ _id: hashed }) with its sweep and rider indexes"
      changes:
        - createCollection:
            collectionName: dispatch_jobs
        - createCollection:
            collectionName: dispatch_active
        - createIndex:
            collectionName: dispatch_active
            keys: '{ "status": 1, "searchFrom": 1 }'
            options: '{ "name": "status_search_from" }'
        - createIndex:
            collectionName: dispatch_active
            keys: '{ "riderId": 1 }'
            options: '{ "name": "rider", "sparse": true }'
        - createIndex:
            collectionName: dispatch_active
            keys: '{ "offerRiderId": 1 }'
            options: '{ "name": "offer_rider", "sparse": true }'
        - createIndex:
            collectionName: dispatch_active
            keys: '{ "storeId": 1 }'
            options: '{ "name": "store" }'
  - changeSet:
      id: dispatch-2
      author: foodstack
      comment: "Work buckets of the matcher (TDD 7.5): each replica sweeps the open jobs of its buckets"
      changes:
        - createIndex:
            collectionName: dispatch_active
            keys: '{ "status": 1, "bucket": 1, "searchFrom": 1 }'
            options: '{ "name": "status_bucket_search_from" }'
        - createIndex:
            collectionName: dispatch_active
            keys: '{ "status": 1, "bucket": 1, "offerExpiresAt": 1 }'
            options: '{ "name": "status_bucket_offer_expiry" }'
  - changeSet:
      id: dispatch-3
      author: foodstack
      comment: "M4 account deletion (PRD ID-7): a deleted customer's jobs are found by customer"
      changes:
        - createIndex:
            collectionName: dispatch_jobs
            keys: '{ "customerId": 1 }'
            options: '{ "name": "customer" }'
