# Liquibase changelog of the settings module (database foodstack_settings).
databaseChangeLog:
  - include:
      file: db/changelog/platform/outbox-inbox.yaml
  - changeSet:
      id: settings-1
      author: foodstack
      comment: "settings_settings: one document per section; unsharded (tiny, rarely written)"
      changes:
        - createCollection:
            collectionName: settings_settings
        - insertMany:
            collectionName: settings_settings
            documents: >-
              [
                { "_id": "branding", "name": "FoodStack", "tagline": "Food from your favourite places, delivered",
                  "primaryColor": "#D84315", "secondaryColor": "#00695C", "fontFamily": "Roboto", "version": { "$numberLong": "0" } },
                { "_id": "locale", "defaultLanguage": "en", "languages": ["en"], "currency": "USD", "timezone": "UTC",
                  "version": { "$numberLong": "0" } }
              ]
  - changeSet:
      id: settings-2
      author: foodstack
      comment: "settings_seed: marker of the test-seed profile"
      changes:
        - createCollection:
            collectionName: settings_seed
  - changeSet:
      id: settings-3
      author: foodstack
      comment: "ordering rules (M2): cash on, card off until a gateway is set up, no fees or tax, tips on, 3-minute accept time"
      changes:
        - insertOne:
            collectionName: settings_settings
            document: >-
              { "_id": "ordering", "cashEnabled": true, "cardEnabled": false, "serviceFeeMinor": { "$numberLong": "0" },
                "serviceFeeBasisPoints": 0, "taxBasisPoints": 0, "tipsEnabled": true, "acceptTimeoutSeconds": 180,
                "version": { "$numberLong": "0" } }
  - changeSet:
      id: settings-4
      author: foodstack
      comment: "settings_dead_letters (M5, G1): failed events for the back office; unsharded (rare), kept 30 days like the .dlt topics"
      changes:
        - createCollection:
            collectionName: settings_dead_letters
        - createIndex:
            collectionName: settings_dead_letters
            keys: '{ "status": 1, "failedAt": -1 }'
            options: '{ "name": "status_failed" }'
        - createIndex:
            collectionName: settings_dead_letters
            keys: '{ "failedAt": -1 }'
            options: '{ "name": "failed" }'
        - createIndex:
            collectionName: settings_dead_letters
            keys: '{ "expiresAt": 1 }'
            options: '{ "name": "expires_ttl", "expireAfterSeconds": 0 }'

