# Liquibase changelog of the payment module (database foodstack_payment). Shard keys are applied by
# PaymentConfiguration (TDD 6.3) and listed next to each collection.
databaseChangeLog:
  - include:
      file: db/changelog/platform/outbox-inbox.yaml
  - changeSet:
      id: payment-1
      author: foodstack
      comment: "payment_intents: one card payment per order, _id = order id; shard key { _id: hashed }. The expiry index finds pages nobody finished."
      changes:
        - createCollection:
            collectionName: payment_intents
        - createIndex:
            collectionName: payment_intents
            keys: '{ "status": 1, "expiresAt": 1 }'
            options: '{ "name": "status_expiry" }'
