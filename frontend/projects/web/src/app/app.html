<fs-brand-header>
  @if (languages().length > 1) {
    <button
      mat-button
      type="button"
      class="language"
      [matMenuTriggerFor]="languageMenu"
      [attr.aria-label]="ui.t('language')"
    >
      <fs-icon name="language" />
      <span class="language-name">{{ locale.languageName(locale.language()) }}</span>
    </button>
    <mat-menu #languageMenu="matMenu" xPosition="before">
      @for (language of languages(); track language) {
        <button
          mat-menu-item
          type="button"
          [attr.lang]="language"
          [attr.aria-current]="language === locale.language()"
          (click)="locale.use(language)"
        >
          @if (language === locale.language()) {
            <fs-icon matMenuItemIcon name="check_circle" />
          }
          <span>{{ locale.languageName(language) }}</span>
        </button>
      }
    </mat-menu>
  }
  @if (auth.signedIn()) {
    <button
      mat-button
      type="button"
      class="account"
      [matMenuTriggerFor]="accountMenu"
      [attr.aria-label]="ui.t('accountMenu')"
    >
      <span class="avatar" aria-hidden="true">{{ initials() }}</span>
      @if (me(); as me) {
        <span class="account-name">{{ me.displayName }}</span>
      }
    </button>
    <mat-menu #accountMenu="matMenu" xPosition="before">
      @if (me(); as me) {
        <div class="account-card">
          <div class="account-card-name">{{ me.displayName }}</div>
          <div class="account-card-email">{{ me.email }}</div>
        </div>
      }
      <button mat-menu-item type="button" (click)="signOut()">
        <fs-icon matMenuItemIcon name="logout" />
        <span>{{ ui.t('signOut') }}</span>
      </button>
    </mat-menu>
  } @else {
    <button mat-button type="button" class="sign-in" (click)="signIn()">
      {{ ui.t('signIn') }}
    </button>
    <button mat-flat-button type="button" class="sign-up" (click)="signUp()">
      {{ ui.t('createAccount') }}
    </button>
  }
</fs-brand-header>
<main>
  <router-outlet />
</main>
