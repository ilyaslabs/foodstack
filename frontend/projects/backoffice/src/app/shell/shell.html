<fs-brand-header>
  <button mat-button type="button" (click)="signOut()">Sign out</button>
</fs-brand-header>
<mat-sidenav-container class="shell">
  <mat-sidenav mode="side" opened class="nav">
    <mat-nav-list>
      <a
        mat-list-item
        routerLink="/"
        routerLinkActive
        #home="routerLinkActive"
        [routerLinkActiveOptions]="{ exact: true }"
        [activated]="home.isActive"
        >Overview</a
      >
      <a
        mat-list-item
        routerLink="/settings/branding"
        routerLinkActive
        #brand="routerLinkActive"
        [activated]="brand.isActive"
        >Branding</a
      >
    </mat-nav-list>
  </mat-sidenav>
  <mat-sidenav-content class="content">
    <router-outlet />
  </mat-sidenav-content>
</mat-sidenav-container>
