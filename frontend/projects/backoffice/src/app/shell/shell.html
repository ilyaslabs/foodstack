<fs-brand-header>
  @if (compact()) {
    <button
      fsHeaderStart
      mat-icon-button
      type="button"
      aria-label="Open navigation"
      (click)="drawer.toggle()"
    >
      <fs-icon name="menu" />
    </button>
  }
  <button mat-button type="button" class="account" [matMenuTriggerFor]="account">
    <span class="avatar" aria-hidden="true">{{ initials() }}</span>
    @if (!compact()) {
      <span class="account-name">{{ me()?.displayName }}</span>
    }
    <span class="cdk-visually-hidden">Account menu</span>
  </button>
</fs-brand-header>

<mat-menu #account="matMenu" xPosition="before" class="account-menu">
  @if (me(); as me) {
    <div class="account-card">
      <span class="avatar avatar-large" aria-hidden="true">{{ initials() }}</span>
      <div>
        <div class="account-card-name">{{ me.displayName }}</div>
        <div class="account-card-email">{{ me.email }}</div>
        <div class="account-card-role">{{ role() }}</div>
      </div>
    </div>
    <mat-divider />
  }
  <a mat-menu-item routerLink="/account/password">
    <fs-icon matMenuItemIcon name="key" />
    <span>Change password</span>
  </a>
  <a mat-menu-item routerLink="/account/security">
    <fs-icon matMenuItemIcon name="lock" />
    <span>Two-step sign-in</span>
  </a>
  <button mat-menu-item type="button" (click)="signOut()">
    <fs-icon matMenuItemIcon name="logout" />
    <span>Sign out</span>
  </button>
</mat-menu>

<mat-sidenav-container class="shell" autosize>
  <mat-sidenav #drawer class="nav" [mode]="compact() ? 'over' : 'side'" [opened]="!compact()">
    <nav aria-label="Main">
      <ul class="nav-list">
        @for (item of nav(); track item.path) {
          <li>
            <a
              class="nav-item"
              matRipple
              [routerLink]="item.path"
              routerLinkActive="active"
              ariaCurrentWhenActive="page"
              [routerLinkActiveOptions]="{ exact: item.exact }"
              (click)="compact() && drawer.close()"
            >
              <fs-icon [name]="item.icon" />
              <span>{{ item.label }}</span>
            </a>
          </li>
        }
      </ul>
    </nav>
  </mat-sidenav>
  <mat-sidenav-content class="content">
    <div class="page">
      <router-outlet />
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>
