# FoodStack server defaults. Every value marked ${...} comes from the environment (.env on one
# server, Secrets and ConfigMaps on Kubernetes). See docs/deployment-guide.md.
spring:
  application:
    name: foodstack-server
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:false}
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 20000
      mail.smtp.writetimeout: 20000
  threads:
    virtual:
      enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 30s
  mongodb:
    # The cluster; each module uses its own database foodstack_<module> on it (TDD 6.1).
    uri: ${MONGODB_URI:mongodb://localhost:27017/?replicaSet=rs0}
    database: foodstack
  data:
    mongodb:
      # Each module enables its own repositories, so they vanish when it is not local.
      repositories:
        type: none
    redis:
      url: ${REDIS_URL:redis://localhost:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      properties:
        # A topic is created by the module that publishes it, with the configured partitions. A
        # consumer that starts first must not create it with one partition by subscribing, and
        # must notice it (and any partitions added) soon after.
        allow.auto.create.topics: false
        metadata.max.age.ms: 30000
    admin:
      fail-fast: false
    listener:
      # continues the trace of the request that wrote the event (traceparent header from the outbox)
      observation-enabled: true
  elasticsearch:
    uris: ${ELASTICSEARCH_URIS:http://localhost:9200}
    username: ${ELASTICSEARCH_USERNAME:}
    password: ${ELASTICSEARCH_PASSWORD:}
  autoconfigure:
    exclude:
      # One MongoTemplate per module instead of Boot's single one (FoodstackMongoAutoConfiguration).
      - org.springframework.boot.data.mongodb.autoconfigure.DataMongoAutoConfiguration
      # The identity module configures the authorization server itself, only where it is local.
      - org.springframework.boot.security.oauth2.server.authorization.autoconfigure.servlet.OAuth2AuthorizationServerAutoConfiguration
      - org.springframework.boot.security.oauth2.server.authorization.autoconfigure.servlet.OAuth2AuthorizationServerJwtAutoConfiguration

server:
  port: 8080
  shutdown: graceful
  # Caddy (one server) or the Gateway (Kubernetes) terminates TLS in front of the server.
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      probes:
        enabled: true
  health:
    elasticsearch:
      enabled: false
  # Tracing (TDD 7.5): W3C traceparent through HTTP, module calls, the outbox and Kafka. Spans are
  # exported over OTLP only when FOODSTACK_TRACING_EXPORT is true, to FOODSTACK_OTLP_ENDPOINT.
  tracing:
    sampling:
      probability: ${FOODSTACK_TRACING_SAMPLING:0.1}
    export:
      otlp:
        enabled: ${FOODSTACK_TRACING_EXPORT:false}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${FOODSTACK_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
  otlp:
    metrics:
      export:
        # metrics stay on the actuator; nothing is pushed
        enabled: false

# Monolith by default: every module local. Helm and the integration tests override per deployment.
module-switch:
  modules:
    identity:
      mode: local
    settings:
      mode: local
    media:
      mode: local
    geo:
      mode: local
    store:
      mode: local
    search:
      mode: local
    promotion:
      mode: local
    cart:
      mode: local
    payment:
      mode: local
    order:
      mode: local
    rider:
      mode: local
    dispatch:
      mode: local
    notification:
      mode: local
    ledger:
      mode: local
    review:
      mode: local
  propagate-headers: [Authorization, Accept-Language]

foodstack:
  environment: ${FOODSTACK_ENVIRONMENT:development}
  namespace: foodstack
  mongodb:
    database-prefix: foodstack_
  kafka:
    topic-partitions: ${KAFKA_TOPIC_PARTITIONS:24}
    replication-factor: ${KAFKA_REPLICATION_FACTOR:1}
  security:
    issuer: ${FOODSTACK_PUBLIC_URL:http://localhost:8080}
    pii-key: ${FOODSTACK_PII_KEY:}
    # Only for deployments that do not run identity themselves (split topologies, TDD 9.1)
    service-client-secret: ${FOODSTACK_SERVICE_CLIENT_SECRET:}
  identity:
    signing-keys: ${FOODSTACK_SIGNING_KEYS:}
    bootstrap-admin:
      email: ${FOODSTACK_ADMIN_EMAIL:}
      password: ${FOODSTACK_ADMIN_PASSWORD:}
    # Keep true; false only for a plain-HTTP trial in a browser that refuses Secure cookies there.
    refresh-cookie-secure: ${FOODSTACK_REFRESH_COOKIE_SECURE:true}
  geo:
    # Address search and reverse geocoding (OpenStreetMap Nominatim by default, "none" to switch off).
    geocoding:
      provider: ${GEOCODING_PROVIDER:nominatim}
      url: ${GEOCODING_URL:https://nominatim.openstreetmap.org}
      user-agent: FoodStack (${FOODSTACK_PUBLIC_URL:http://localhost:8080})
      country-codes: ${GEOCODING_COUNTRY_CODES:}
    # Road distance and driving time for quotes, dispatch and live ETAs: "osrm" with ROUTING_URL, or
    # "none" for the straight-line estimate (distance x road factor at an urban average speed).
    routing:
      provider: ${ROUTING_PROVIDER:none}
      url: ${ROUTING_URL:}
  search:
    index-prefix: ${SEARCH_INDEX_PREFIX:foodstack_}
    replicas: ${SEARCH_REPLICAS:0}
  storage:
    endpoint: ${S3_ENDPOINT:http://localhost:9000}
    public-endpoint: ${S3_PUBLIC_ENDPOINT:${FOODSTACK_PUBLIC_URL:http://localhost:9000}}
    access-key: ${S3_ACCESS_KEY:}
    secret-key: ${S3_SECRET_KEY:}
    public-bucket: ${S3_PUBLIC_BUCKET:foodstack-public}
    private-bucket: ${S3_PRIVATE_BUCKET:foodstack-private}
    create-buckets: ${S3_CREATE_BUCKETS:false}
  order:
    # Where the customer app lives: card payment pages send the customer back to <web-url>/orders/<id>.
    web-url: ${FOODSTACK_WEB_URL:${FOODSTACK_PUBLIC_URL:http://localhost:8080}}
  notification:
    # Emails (PRD 4.10): sent only when SMTP_HOST and SMTP_FROM are set; otherwise the log shows them as skipped.
    from-address: ${SMTP_FROM:}
    from-name: ${SMTP_FROM_NAME:FoodStack}
    admin-url: ${FOODSTACK_ADMIN_URL:${FOODSTACK_PUBLIC_URL:http://localhost:8080}}/admin
    # Push (TDD 8.3): on when a Firebase service account is set (the key file's path, or its JSON);
    # web push also needs the web app config (one-line JSON) and the VAPID key.
    push:
      fcm-service-account: ${FCM_SERVICE_ACCOUNT:}
      web-config: ${FCM_WEB_CONFIG:}
      vapid-key: ${FCM_VAPID_KEY:}
  payment:
    # Card gateway (TDD 5.4): none (cash only), sandbox (development and demos, refused in production) or stripe.
    gateway: ${PAYMENT_GATEWAY:none}
    public-url: ${FOODSTACK_PUBLIC_URL:http://localhost:8080}
    sandbox-secret: ${PAYMENT_SANDBOX_SECRET:}
    stripe:
      secret-key: ${STRIPE_SECRET_KEY:}
      webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
      publishable-key: ${STRIPE_PUBLISHABLE_KEY:}
