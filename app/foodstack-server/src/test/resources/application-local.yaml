# Local development only (LocalFoodstackApplication). Never use these values anywhere else.
foodstack:
  environment: development
  mongodb:
    sharding:
      enabled: true
  kafka:
    topic-partitions: 3
  security:
    issuer: http://localhost:8080
    # A fixed development key so encrypted test data survives restarts. Not a secret.
    pii-key: ZGV2ZWxvcG1lbnQta2V5LW5vdC1mb3ItcHJvZHVjdGlvbiEhISE=
  identity:
    # the shared test accounts below would lock each other out if their roles required an
    # authenticator app; two-step sign-in stays optional here (Account menu > Two-step sign-in)
    totp:
      required-roles: []
    bootstrap-admin:
      email: admin@local.foodstack.local
      password: foodstack-local
  storage:
    create-buckets: true
    # The dev servers upload straight to the local storage, which allows these two origins.
    check-origins: http://localhost:4200,http://localhost:4300
  payment:
    gateway: sandbox
  order:
    web-url: http://localhost:4200
